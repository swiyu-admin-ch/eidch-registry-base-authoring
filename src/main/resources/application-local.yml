server:
  port: 8180 # dedicated within swiyu to avoid conflicts

jeap:
  monitor:
    prometheus:
      password: "{noop}prometheus"
      user: "prometheus"
  security:
    oauth2:
      resourceserver:
        resource-id: bj-swiyu-ecosystem-portal-scs # Resource ID of the application as it is configured in oauth servers
        authorization-server:
          issuer: https://swiyu-oauth-mock-server-d.apps.p-szb-ros-shrd-npr-01.cloud.admin.ch
        auth-servers: # Additional authorization servers
          - issuer: https://auth-d.trust-infra.swiyu.admin.ch/realms/bj-swiyu-ecosystem
          - issuer: https://auth-r.trust-infra.swiyu.admin.ch/realms/bj-swiyu-ecosystem-portal-scs
          - issuer: http://localhost:8480 # mock server started locally

spring:
  datasource:
    url: "jdbc:postgresql://localhost:5180/identifier-registry-db"
    username: "postgres"
    password: "secret"
  docker:
    compose:
      enabled: true
      file: compose.yaml

springdoc:
  swagger-ui:
    oauth:
      client-id: ${jeap.security.oauth2.resourceserver.resource-id}

logging:
  level:
    ch.admin.bit.jeap: DEBUG
    ch.admin.bj.swiyu: DEBUG

management:
  endpoint:
    health:
      show-details: always
      show-components: always

did-authoring:
  didTdwRouteTemplate: "http://localhost:8190/api/v1/did/{0}"
  didWebTemplate: "did:web:localhost%3A8190:api:v1:did:{0}"
