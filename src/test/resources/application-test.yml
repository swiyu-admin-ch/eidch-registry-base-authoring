jeap:
  security:
    oauth2:
      resourceserver:
        authorization-server:
          issuer: https://example.com

spring:
  datasource:
    url: 'jdbc:postgresql://localhost:5431/identifier-registry-db'
    username: postgres
    password: secret
    driverClassName: org.postgresql.Driver
    hikari:
      maximum-pool-size: 2
  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations:
      - classpath:db/migration/common

did-authoring:
  didTdwRouteTemplate: "HTTP:TESTROUTE:{0}"
  didWebTemplate: "DID:TESTROUTE/{0}"
